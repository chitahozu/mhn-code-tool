<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>特典コード QR ツール</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

:root{--bg:#f5f7f8;--card:#fff;--text:#17202a;--muted:#68737d;--line:#dfe5e9;--green:#25855b;--green2:#e5f4ed;--red:#d94b4b;--shadow:0 2px 12px #0000000d}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}

.wrap{max-width:680px;margin:auto;padding:18px 14px 40px}

h1{font-size:27px;margin:8px 2px 18px}

.sub{color:var(--muted);font-size:14px;margin:-10px 2px 18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}

.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:15px}

.tab.active{background:var(--green2);border-color:var(--green);color:var(--green);font-weight:700}

.row{display:flex;gap:9px;align-items:center}

input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 13px;font-size:16px;color:var(--text);outline:none}

textarea{min-height:125px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55}

input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #25855b18}

button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:11px 15px;font-size:15px;font-weight:600}

button.green{background:var(--green);color:#fff;border-color:var(--green)}

label{display:block;color:var(--muted);font-size:13px;font-weight:700;margin:0 0 7px}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}

.pill{background:#f0f2f3;border-radius:999px;padding:7px 11px;font-size:13px;color:#505a62}

.list{display:grid;gap:8px;margin-top:12px}

.code{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px}

.num{width:28px;text-align:right;color:#8a939a;font-size:13px}

.check{width:22px;height:22px;accent-color:var(--green);flex:0 0 auto}

.codebtn{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#f3f4f5;border:0;border-radius:999px;padding:9px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}

.used{opacity:.55}

.used .codebtn{text-decoration:line-through}

.empty{text-align:center;color:var(--muted);padding:30px 10px}

.hint{font-size:12px;color:var(--muted);line-height:1.5}

.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}

.modal.show{display:flex}

.modalbox{background:#fff;border-radius:22px;padding:22px;max-width:360px;width:100%;text-align:center}

.qr{display:flex;justify-content:center;margin:18px 0}

.qr canvas,.qr img{max-width:100%;height:auto}

.modalcode{font-family:ui-monospace,monospace;font-size:17px;font-weight:700;word-break:break-all;margin:12px 0}

@media(min-width:600px){.wrap{padding-top:28px}}

</style>

</head>

<body>

<div class="wrap">

<h1>特典コード QR ツール</h1>

<div class="sub">コードを選ぶだけでQRコードをすぐ表示できます</div>

<div class="card">

<div id="tabs" class="tabs"></div>

</div>

<div class="card">

<label>タイトル</label>

<input id="title" placeholder="例：CAギルドカード背景">

<div style="height:12px"></div>

<label>コードを1行に1つ入力（最大100件）</label>

<textarea id="input" placeholder="コードを1行ずつ貼り付け"></textarea>

<div class="row" style="margin-top:10px">

<button class="green" id="add">一覧に反映</button>

<button id="clear">入力を消去</button>

</div>

<div class="hint" style="margin-top:8px">

既存の保存データがある場合は自動的に引き継ぎます。

</div>

</div>

<div class="card">

<div class="row">

<div style="flex:1">

<label>コードを検索</label>

<input id="search" placeholder="コードを検索">

</div>

</div>

<div class="stats">

<span class="pill" id="total">0件</span>

<span class="pill" id="unused">未使用 0件</span>

<span class="pill" id="used">使用済み 0件</span>

</div>

<div id="list" class="list"></div>

</div>

</div>

<div id="modal" class="modal">

<div class="modalbox">

<div style="font-size:18px;font-weight:700">

QRコード

</div>

<div id="qr" class="qr"></div>

<div id="modalcode" class="modalcode"></div>

<div class="row">

<button class="green" id="mark">使用済みにする</button>

<button id="close">閉じる</button>

</div>

</div>

</div>

<script>

(function(){

const $=id=>document.getElementById(id);

let tabs=[];

let active=0;

let selected=null;

let saveTimer=null;

const KEY="mhn_qr_tool_v2";

function normalizeCode(x){

return String(x||"").trim();

}

function validCodes(arr){

return Array.isArray(arr)

?arr.map(normalizeCode)

.filter(x=>x&&x.length<200)

.slice(0,100)

:[];

}

function legacyImport(){

let found=null;

try{

for(let i=0;i<localStorage.length;i++){

const k=localStorage.key(i);

const raw=localStorage.getItem(k);

if(!raw)continue;

try{

const o=JSON.parse(raw);

const walk=v=>{

if(found)return;

if(Array.isArray(v)){

const a=v.map(x=>

typeof x==="string"

?x

:(x&&typeof x==="object"

?(x.code||x.value||x.text||"")

:"")

);

const c=validCodes(a);

if(c.length>=2){

found=c;

return;

}

v.forEach(walk);

}else if(v&&typeof v==="object"){

Object.values(v).forEach(walk);

}

};

walk(o);

}catch(e){}

}

}catch(e){}

return found||[];

}

function save(){

clearTimeout(saveTimer);

saveTimer=setTimeout(()=>{

localStorage.setItem(KEY,JSON.stringify(tabs));

},100);

}

function load(){

try{

const a=JSON.parse(

localStorage.getItem(KEY)||"null"

);

if(Array.isArray(a)&&a.length){

tabs=a;

return;

}

}catch(e){}

const legacy=legacyImport();

tabs=[{

title:"特典コード",

codes:legacy.map(c=>({

code:c,

used:false

}))

}];

}

function renderTabs(){

$("tabs").innerHTML="";

tabs.forEach((t,i)=>{

const b=document.createElement("button");

b.className="tab"+(i===active?" active":"");

b.textContent=t.title||("タブ"+(i+1));

b.onclick=()=>{

active=i;

loadTab();

renderTabs();

};

$("tabs").appendChild(b);

});

const add=document.createElement("button");

add.className="tab";

add.textContent="+ タブ追加";

add.onclick=addTab;

$("tabs").appendChild(add);

}

function loadTab(){

const t=tabs[active]||{

title:"特典コード",

codes:[]

};

$("title").value=t.title||"";

$("input").value="";

renderList();

}

function addTab(){

const name=prompt(

"タブ名を入力してください",

"新しいタブ"

);

if(!name)return;

tabs.push({

title:name.trim(),

codes:[]

});

active=tabs.length-1;

save();

renderTabs();

loadTab();

}

function renderList(){

const t=tabs[active];

if(!t)return;

const q=$("search").value.trim().toLowerCase();

const arr=t.codes.filter(x=>

!q||x.code.toLowerCase().includes(q)

);

$("total").textContent=

t.codes.length+"件";

$("unused").textContent=

"未使用 "+t.codes.filter(x=>!x.used).length+"件";

$("used").textContent=

"使用済み "+t.codes.filter(x=>x.used).length+"件";

const list=$("list");

list.innerHTML="";

if(!arr.length){

list.innerHTML=

'<div class="empty">コードがありません</div>';

return;

}

arr.forEach(x=>{

const original=t.codes.indexOf(x);

const row=document.createElement("div");

row.className=

"code"+(x.used?" used":"");

const n=document.createElement("span");

n.className="num";

n.textContent=original+1;

const cb=document.createElement("input");

cb.type="checkbox";

cb.className="check";

cb.checked=!!x.used;

cb.onchange=()=>{

x.used=cb.checked;

save();

renderList();

};

const b=document.createElement("button");

b.className="codebtn";

b.textContent=x.code;

b.onclick=()=>showQR(original);

row.append(n,cb,b);

list.appendChild(row);

});

}

function addCodes(){

const t=tabs[active];

const lines=validCodes(

$("input").value.split(/\r?\n/)

);

const exists=new Set(

t.codes.map(x=>x.code)

);

lines.forEach(c=>{

if(

!exists.has(c)&&

t.codes.length<100

){

t.codes.push({

code:c,

used:false

});

exists.add(c);

}

});

$("input").value="";

save();

renderList();

}

function showQR(i){

const x=tabs[active].codes[i];

if(!x)return;

selected=i;

$("qr").innerHTML="";

$("modalcode").textContent=x.code;

new QRCode(

$("qr"),

{

text:x.code,

width:240,

height:240,

correctLevel:QRCode.CorrectLevel.M

}

);

$("mark").textContent=

x.used

?"未使用に戻す"

:"使用済みにする";

$("modal").classList.add("show");

}

$("close").onclick=()=>

$("modal").classList.remove("show");

$("modal").onclick=e=>{

if(e.target===$("modal"))

$("modal").classList.remove("show");

};

$("mark").onclick=()=>{

if(selected===null)return;

const x=

tabs[active].codes[selected];

x.used=!x.used;

save();

$("modal").classList.remove("show");

renderList();

};

$("add").onclick=addCodes;

$("clear").onclick=()=>

$("input").value="";

$("search").oninput=renderList;

$("title").oninput=()=>{

tabs[active].title=

$("title").value;

save();

renderTabs();

};

load();

renderTabs();

loadTab();

})();

</script>

</body>

</html>
